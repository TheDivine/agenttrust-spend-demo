name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    container: node:24-bookworm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --version
      - run: npm test
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build local worker runtime and run containment tests
        shell: bash
        run: |
          set -euo pipefail
          image=$(python3 tools/build-worker-runtime.py --node-binary "$(command -v node)" --cache-dir data/worker-runtime)
          AGENTTRUST_TEST_DOCKER_IMAGE="$image" npm test
          npm run enforced:demo -- --image "$image"
